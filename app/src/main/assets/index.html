<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApuGPT</title><style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:#f5f5f5;
}
header{
  padding:22px 18px;
  border-bottom:1px solid #293047;
  color:#e7bd67;
  font-size:25px;
  font-weight:bold;
}
header small{
  display:block;
  color:#aab1c5;
  font-size:12px;
  margin-top:5px;
  font-weight:normal;
}
main{
  max-width:650px;
  margin:auto;
  padding:24px 16px 125px;
}
h1{font-size:28px;margin-top:20px}
.gold{color:#e7bd67}
.subtitle{color:#aab1c5;line-height:1.6}
.card{
  background:#151c30;
  border:1px solid #293047;
  border-radius:16px;
  padding:18px;
  margin-top:18px;
}
button{
  background:#e7bd67;
  color:#111827;
  border:0;
  padding:12px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
  cursor:wait;
}
#chat{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.6;
  margin-top:20px;
}
form{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  gap:8px;
  padding:12px;
  background:#0b1020;
  border-top:1px solid #293047;
}
input{
  flex:1;
  min-width:0;
  background:#151c30;
  color:white;
  border:1px solid #39435d;
  border-radius:10px;
  padding:13px;
  font-size:15px;
}
.note{font-size:12px;color:#9da6bb}

/* Admin Instagram Watermark */
.admin-watermark{
position:fixed;
bottom:76px;
right:14px;
z-index:10;
display:flex;
align-items:center;
gap:8px;
padding:10px 13px;
border:1px solid #806a3c;
border-radius:30px;
background:#151c30;
color:#e7bd67;
text-decoration:none;
font-size:12px;
box-shadow:0 4px 18px rgba(0,0,0,.35);
}
.admin-watermark .insta-icon{
width:25px;
height:25px;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
background:#e7bd67;
color:#0b1020;
font-size:17px;
font-weight:bold;
}
.admin-watermark strong{display:block;font-size:13px}
.admin-watermark span{color:#aab1c5}
.admin-watermark:active{transform:scale(.97)}
</style></head><body>
<header>
  ApuGPT
  <small>Your AI assistant</small>
</header><main>
  <h1>Hello! Welcome to <span class="gold">ApuGPT</span></h1>
  <p class="subtitle">
    Your personal assistant for learning, ideas and everyday questions.
  </p>  <div class="card">
    <h3 class="gold">What can I help you with?</h3>
    <p>Ask a question or type a message below to get started.</p>
    <button type="button" onclick="document.getElementById('message').focus()">
      Start Chatting
    </button>
  </div>  <div id="chat" aria-live="polite"></div>  <p class="note">ApuGPT • AI assistant</p>
</main><a class="admin-watermark"
href="https://www.instagram.com/imnot.apurba/"
target="_blank"
rel="noopener noreferrer"
aria-label="Visit Admin Instagram profile">

  <div class="insta-icon">◎</div>
  <div>
    <span>ADMIN WATERMARK</span>
    <strong>@imnot.apuraba ↗</strong>
  </div>
</a><form id="form">
  <input
    id="message"
    placeholder="Type your message..."
    autocomplete="off"
    aria-label="Your message"
  >
  <button id="send" type="submit">Send</button>
</form><script>
const form = document.getElementById('form');
const input = document.getElementById('message');
const chat = document.getElementById('chat');
const sendButton = document.getElementById('send');

// ApuGPT Render backend
const API_URL = 'https://apugpt.onrender.com/chat';

form.addEventListener('submit', async function(e) {
  e.preventDefault();

  const message = input.value.trim();
  if (!message) return;

  chat.textContent += 'You: ' + message + '\n\n';
  input.value = '';
  input.disabled = true;
  sendButton.disabled = true;
  sendButton.textContent = 'Wait...';

  const loading = document.createElement('div');
  loading.textContent = 'ApuGPT: Thinking...';
  chat.appendChild(loading);

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message: message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'AI request failed.');
    }

    loading.textContent = 'ApuGPT: ' + (data.reply || 'No response received.');

  } catch (error) {
    loading.textContent =
      'ApuGPT: Could not connect to AI. Please try again.\n' +
      'Details: ' + error.message;
  } finally {
    input.disabled = false;
    sendButton.disabled = false;
    sendButton.textContent = 'Send';
    input.focus();
    window.scrollTo(0, document.body.scrollHeight);
  }
});
</script></body>
</html>
